<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PayLite: UPI payments demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E4DEF0; --bg:#F5F2FB; --surface:#FFFFFF; --ink:#17112B; --ink2:#6A6480; --line:#E2DCF0;
  --brand:#5B2BBF; --on-brand:#FFFFFF; --soft:#EBE3FA; --link:#5B2BBF;
  --panel:#5B2BBF; --on-panel:#FFFFFF;
  --accent:#FF8A3D; --on-accent:#2A1100;
  --warm-bg:#FFE9D6; --warm-ink:#B4530F;
  --ok:#187A44; --ok-soft:#DDF3E6; --bad:#B93A3A; --bad-soft:#F9E1E1;
  --av-s:55%; --av-l:86%; --av-t:26%;
  --sh:0 1px 2px rgba(10,40,38,.06),0 6px 18px rgba(10,40,38,.07);
  --f-head:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#000000; --bg:#08070B; --surface:#17161C; --ink:#F5F3FA; --ink2:#9C98AA; --line:#2A2833;
    --brand:#6D3FE0; --on-brand:#FFFFFF; --soft:#2A2046; --link:#BBA0FF;
    --panel:#17161C; --on-panel:#F5F3FA;
    --accent:#FF8A3D; --on-accent:#2A1100;
    --warm-bg:#3A2418; --warm-ink:#FFA35C;
    --ok:#4BD689; --ok-soft:#153A27; --bad:#FF8080; --bad-soft:#3E1B1B;
    --av-s:40%; --av-l:26%; --av-t:84%;
    --sh:0 1px 2px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --desk:#000000; --bg:#08070B; --surface:#17161C; --ink:#F5F3FA; --ink2:#9C98AA; --line:#2A2833;
    --brand:#6D3FE0; --on-brand:#FFFFFF; --soft:#2A2046; --link:#BBA0FF;
    --panel:#17161C; --on-panel:#F5F3FA;
    --accent:#FF8A3D; --on-accent:#2A1100;
    --warm-bg:#3A2418; --warm-ink:#FFA35C;
    --ok:#4BD689; --ok-soft:#153A27; --bad:#FF8080; --bad-soft:#3E1B1B;
    --av-s:40%; --av-l:26%; --av-t:84%;
    --sh:0 1px 2px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--desk);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

#app{max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;box-shadow:0 0 0 1px var(--line)}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;outline:none}
.i{width:22px;height:22px;flex:none}
.i.s{width:14px;height:14px}
.i.l{width:26px;height:26px}
.pad{padding:4px 16px 28px}
.pad h2,.sec-t{font:700 17px/1.2 var(--f-head);margin:24px 0 12px}
.muted{color:var(--ink2)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.err.c{text-align:center}


/* home: hero + sections */
.hero{background:linear-gradient(150deg,#4B1C9E 0%,#8A2BA6 55%,#D63A73 100%);color:#fff;padding:14px 16px 24px;border-radius:0 0 26px 26px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hav-wrap{position:relative;width:44px;height:44px}
.hav{width:44px;height:44px;border-radius:50%;border:0;background:#F5B93A;color:#3A2500;font:700 15px var(--f-head)}
.hqr{position:absolute;right:-7px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:#0E0B18;color:#fff;border:2px solid #fff;display:grid;place-items:center;padding:0}
.hero-body{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.hero h2{font:700 36px/1.08 var(--f-head);color:#FFD98A}
.hero p{margin:8px 0 16px;font-size:13.5px;opacity:.92;max-width:190px}
.hero-art{width:136px;flex:none}
.pillbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1A0F33;border:2px solid #C9B1FF;border-radius:99px;padding:7px 7px 7px 18px;font:700 17px var(--f-body)}
.pb-ic{width:30px;height:30px;border-radius:50%;background:#1A0F33;color:#FFD98A;display:grid;place-items:center}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 14px}
.pad .sec-h h2{margin:0;font:700 17px/1.2 var(--f-ui);letter-spacing:.1px}
.invite{display:inline-flex;gap:6px;align-items:center;background:var(--warm-bg);color:var(--warm-ink);border:1px solid transparent;border-radius:99px;padding:7px 12px;font:600 13px var(--f-ui)}
.mts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;font:500 13px/1.3 var(--f-ui);text-align:center;padding:0}
.mt>span:last-child{max-width:76px}
.mt-ic{position:relative;width:70px;height:70px;border-radius:50%;background:#6A1FD6;color:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.mti{width:42px;height:42px;display:block}
.gdot{position:absolute;top:2px;right:3px;width:13px;height:13px;border-radius:50%;background:#22C55E;border:2.5px solid var(--bg)}
.cb-tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#F26A2E;color:#fff;font:600 11px/1 var(--f-ui);padding:4px 8px;border-radius:5px;font-style:normal;white-space:nowrap}
.promos{display:flex;gap:10px;overflow-x:auto;margin:22px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.promos::-webkit-scrollbar{display:none}
.promo{flex:none;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px 9px 10px;font:500 13.5px var(--f-body);text-align:left;white-space:nowrap}
.promo .ico{width:30px;height:30px}
.promo .ico .i{width:17px;height:17px}
.bcards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bc{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font:500 13px/1.3 var(--f-ui);text-align:center;padding:0}
.bc-i{width:100%;height:64px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--c,var(--link))}
.bc-i .i{width:30px;height:30px}
.wide-row{display:flex;gap:10px;margin-top:14px}
.wide{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:500 14px var(--f-body);text-align:left}
.wide .wico{width:34px;height:34px;border-radius:8px;background:#FF5A3D;color:#fff;display:grid;place-items:center;flex:none}
.wide .wico .i{width:19px;height:19px}
.more{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);color:var(--link);border-radius:12px;padding:12px 16px;font:700 14px var(--f-body)}


/* receipt screen */
.rc-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;padding:10px 12px 10px 6px;color:#fff;background:#1E8E3E}
.rc-head.fail{background:#C0392B}.rc-head.pend{background:#B7791F}
.rc-head .ib{color:#fff}
.rc-head .ib:hover{background:rgba(255,255,255,.16)}
.rc-head h1{font:700 18px/1.2 var(--f-body)}
.rc-head small{display:block;font-size:12.5px;opacity:.92;margin-top:1px}
.rc-body{padding:14px 12px 30px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.rlab{font:600 16px var(--f-body);margin-bottom:14px}
.rrow{display:flex;align-items:center;gap:12px}
.rav{width:44px;height:44px;border-radius:12px;background:#A78BFA;color:#fff;display:grid;place-items:center;flex:none}
.rrow .rt b{font:500 17px var(--f-body)}
.rrow .rt small{font-size:14px}
.ramt2{font:700 20px var(--f-body);font-variant-numeric:tabular-nums;margin-left:auto}
.hr{height:1px;background:var(--line);margin:16px 0}
.pdh{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;font:500 16px var(--f-body);text-align:left}
.pdh span{flex:1}
.pdh .chev{transition:transform .2s;transform:rotate(180deg)}
.pdh[aria-expanded="false"] .chev{transform:none}
.pdl{font-size:13px;color:var(--ink2);margin-top:16px}
.pdv{display:flex;align-items:center;justify-content:space-between;gap:10px;font:500 16px var(--f-body);word-break:break-all;margin-top:3px}
.cp{background:none;border:0;color:var(--link);padding:4px;flex:none}
.btile{width:42px;height:42px;border-radius:6px;background:#fff;display:grid;place-items:center;color:#1F5FD0;flex:none}
.pdrow{display:flex;align-items:center;gap:12px;margin-top:8px}
.pdrow b{font:500 17px var(--f-body)}
.utr{display:flex;align-items:center;justify-content:space-between;color:var(--ink2);margin:8px 0 0 54px;font-size:15px}
.acts4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.a4{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font:500 12.5px/1.25 var(--f-body);padding:0}
.a4 .a4i{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--link);display:grid;place-items:center}
.a4:disabled{opacity:.4;cursor:not-allowed}
.supp{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;font:500 16px var(--f-body);text-align:left}
.supp span{flex:1}
.powered{text-align:center;color:var(--ink2);font-size:13px;margin-top:26px}
.powered b{color:var(--ink);letter-spacing:.5px}
.rnote{margin:12px 2px 0;color:var(--ink2);font-size:14px}

/* header */
.bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--bg)}
.bar h1{font:700 20px/1.2 var(--f-head);flex:1}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;color:var(--ink)}
.ib:hover{background:var(--soft)}
.ib.inv{color:var(--on-panel)}
.ib.inv:hover{background:rgba(255,255,255,.14)}

/* avatar / icon chips */
.av{--h:180;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;flex:none;font:700 15px var(--f-head);background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) 65% var(--av-t))}
.av.lg{width:52px;height:52px;font-size:17px}
.av.xl{width:64px;height:64px;font-size:22px}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--link);flex:none}
.ico.in{background:var(--ok-soft);color:var(--ok)}
.ico.bad{background:var(--bad-soft);color:var(--bad)}

/* home panel */
.panel{background:var(--panel);color:var(--on-panel);padding:14px 16px 60px;border-radius:0 0 28px 28px}
.who{display:flex;align-items:center;gap:12px}
.who .av{background:rgba(255,255,255,.16);color:var(--on-panel)}
.wt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.hi{font:700 20px/1.2 var(--f-head)}
.upi{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;color:var(--on-panel);opacity:.85;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--on-panel);border-radius:16px;padding:14px 4px 11px;font:600 12px/1.2 var(--f-body);text-align:center}
.tile:hover{background:rgba(255,255,255,.18)}
.strip{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:-34px 16px 0;position:relative;background:var(--surface);border:0;border-radius:16px;padding:12px 14px;box-shadow:var(--sh);text-align:left}
.strip span:nth-child(2){flex:1;display:flex;flex-direction:column}
.strip small{color:var(--ink2)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.gi{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font:500 12px/1.2 var(--f-body);text-align:center;padding:0}
.gi .ico{width:52px;height:52px;border-radius:16px}
.ppl-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px}
.ppl{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;min-width:56px;padding:0}
.banner{display:flex;align-items:center;gap:12px;width:100%;margin-top:20px;background:var(--accent);color:var(--on-accent);border:0;border-radius:16px;padding:14px;text-align:left}
.banner span{flex:1;display:flex;flex-direction:column}
.banner small{opacity:.8}

/* lists */
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left}
.row:last-child{border-bottom:0}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt small{color:var(--ink2);font-size:12.5px}
.ramt{font:700 16px var(--f-head);font-variant-numeric:tabular-nums}
.ramt.pos{color:var(--ok)}
.ramt.strike{color:var(--ink2);text-decoration:line-through}
.tag{font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px;background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--soft);color:var(--brand)}
.group{font:600 12.5px var(--f-body);color:var(--ink2);margin:18px 0 2px}
.card{background:var(--surface);border-radius:18px;padding:4px 16px;box-shadow:var(--sh)}
.card.p{padding:16px}
.empty{text-align:center;color:var(--ink2);padding:36px 16px}
.link{background:none;border:0;color:var(--link);font-weight:700;padding:6px 0}

/* forms */
.lab{display:block;font-weight:600;font-size:13px;margin:16px 0 6px;color:var(--ink2)}
.input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--soft)}
select.input{appearance:auto}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 14px;color:var(--ink2)}
.search input{flex:1;border:0;background:transparent;padding:14px 0;font:inherit;font-size:16px;color:var(--ink);min-width:0}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--brand);color:var(--on-brand);font:700 16px var(--f-body);padding:15px;margin-top:18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--link)}
.btn.warn{background:var(--bad);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--surface);box-shadow:var(--sh);color:var(--link)}

/* pay screen */
.payee{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.payee .rt small{font-size:13px}
.amt-wrap{display:flex;align-items:baseline;justify-content:center;gap:4px;margin:26px 0 0}
.cur{font:700 40px var(--f-head);color:var(--ink2)}
.amt{width:100%;max-width:240px;border:0;background:transparent;font:700 56px/1.1 var(--f-head);color:var(--ink);text-align:left;padding:0;font-variant-numeric:tabular-nums}
.amt:focus{outline:none}
.amt-wrap:focus-within .cur{color:var(--brand)}
.amt-wrap{border-bottom:2px solid var(--line);padding-bottom:6px;width:fit-content;margin-left:auto;margin-right:auto}
.from{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.from span{flex:1;display:flex;flex-direction:column}
.from small{color:var(--ink2)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.plan b{font:700 18px var(--f-head)}
.plan small{color:var(--ink2);font-size:12px}
.plan.on{border-color:var(--brand);background:var(--soft)}
.billcard{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:16px;margin-top:16px}
.billcard .n{font:700 32px var(--f-head);margin:6px 0 2px}

/* result */
.result{text-align:center;padding:36px 20px 28px}
.seal{width:84px;height:84px;margin:0 auto 18px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.seal svg{width:100%;height:100%;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.result.ok .seal{color:var(--ok)}
.result.fail .seal{color:var(--bad)}
.seal .c{fill:currentColor;fill-opacity:.12;stroke:currentColor}
.seal .k{stroke:currentColor;stroke-dasharray:44;stroke-dashoffset:44;animation:draw .45s .25s forwards}
.result .big{font:700 44px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.result .lead{margin-top:6px;font-size:16px}
.result .sub{color:var(--ink2);margin-top:6px}
.kv{margin:22px 0 0;text-align:left;background:var(--surface);border-radius:16px;padding:6px 16px;box-shadow:var(--sh)}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--ink2);flex:none}
.kv dd{margin:0;text-align:right;font-weight:600;word-break:break-all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}

/* scan */
.scanwrap{background:#0A1211;color:#fff;min-height:100%;padding-bottom:24px}
.scanwrap .bar{background:transparent;color:#fff}
.scanwrap .ib{color:#fff}
.vf{display:flex;flex-direction:column;align-items:center;padding:8px 24px 18px}
.frame{position:relative;width:210px;height:210px;margin:10px 0 16px;background:rgba(255,255,255,.04);border-radius:18px}
.frame i{position:absolute;width:38px;height:38px;border:4px solid var(--accent)}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.sweep{position:absolute;left:14px;right:14px;height:2px;background:var(--accent);top:14px;animation:sweep 2.4s ease-in-out infinite alternate}
@keyframes sweep{to{top:190px}}
.vf p{color:rgba(255,255,255,.7);text-align:center;font-size:13.5px;max-width:280px}
.scanwrap .lst{padding:0 16px}
.scanwrap .row{border-color:rgba(255,255,255,.12);color:#fff}
.scanwrap .rt small{color:rgba(255,255,255,.6)}
.scanwrap .ico{background:rgba(255,255,255,.1);color:var(--accent)}
.scanwrap .btn.ghost{background:rgba(255,255,255,.1);color:#fff}

/* qr */
.qrcard{text-align:center;padding:24px 16px}
.qr{width:220px;height:220px;margin:0 auto 14px;background:#fff;padding:12px;border-radius:16px;color:#0F1F1E;border:1px solid var(--line)}
.qr svg{width:100%;height:100%;display:block}

/* rewards */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{border:0;border-radius:18px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center}
.rc.new{background:var(--accent);color:var(--on-accent);font-weight:700;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 8px,transparent 8px 16px)}
.rc.done{background:var(--surface);box-shadow:var(--sh)}
.rc .amt2{font:700 30px var(--f-head);color:var(--ok)}
.rc.fresh{animation:pop .4s}

/* sheet */
#overlay{position:fixed;inset:0;background:rgba(5,15,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#overlay[hidden]{display:none}
#sheet{width:100%;max-width:460px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sh-t{font:700 20px var(--f-head);text-align:center}
.sh-s{color:var(--ink2);text-align:center;margin:4px 0 16px;font-size:14px}
.sheet-l{font:700 20px var(--f-head);margin-bottom:10px}
.dots{display:flex;justify-content:center;gap:16px;margin:6px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink2)}
.dots i.on{background:var(--brand);border-color:var(--brand)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.key{border:0;border-radius:14px;background:var(--bg);color:var(--ink);font:600 24px var(--f-head);padding:14px;display:grid;place-items:center}
.key:active{background:var(--soft)}
.sec{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--ink2);margin-top:12px;font-size:12.5px}
.proc{text-align:center;padding:30px 0}
.spin{display:block;width:40px;height:40px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--brand);margin:0 auto 14px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.balres{text-align:center;padding:10px 0 4px}
.bigbal{font:700 44px var(--f-head);margin:8px 0 2px;font-variant-numeric:tabular-nums}
.pick{display:flex;align-items:center;gap:12px;width:100%;background:none;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;text-align:left}
.pick.on{border-color:var(--brand);background:var(--soft)}
.pick span{flex:1;display:flex;flex-direction:column}
.pick small{color:var(--ink2)}

/* nav */
#nav{display:flex;align-items:center;background:var(--bg);border-top:1px solid var(--line);padding:8px 4px calc(6px + env(safe-area-inset-bottom,0px));position:relative;z-index:2}
#nav[hidden]{display:none}
.nt{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;padding:4px 0;color:var(--ink2);color:color-mix(in srgb,var(--ink) 74%,transparent);font:400 13px/1.1 var(--f-body)}
.nt .i{width:26px;height:26px;stroke-width:1.6}
.nt.fab .fb .i{stroke-width:1.8}
.nt.on{color:var(--ink)}
.nt.on span{font-weight:700}
.ndot{position:absolute;top:2px;left:calc(50% + 6px);width:9px;height:9px;border-radius:50%;background:#FF4D6D;border:2px solid var(--bg)}
.nt.fab{padding:0}
.nt.fab .fb{width:56px;height:56px;border-radius:50%;background:#9333EA;color:#fff;display:grid;place-items:center}
.nt.fab .fb .i{width:30px;height:30px}
.nt.fab:active .fb{transform:scale(.95)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:min(400px,90vw);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

function pinHTML(title,sub,err){
  const k=n=>`<button class="key" data-act="key" data-k="${n}">${n}</button>`;
  return `<h2 class="sh-t">${esc(title)}</h2><p class="sh-s">${esc(sub)}</p>
  <div class="dots ${err?'shake':''}" id="dots" aria-label="PIN entry"><i></i><i></i><i></i><i></i></div>
  <p class="err c" id="pinErr" role="alert">${esc(err||'')}</p>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(k).join('')}<span></span>${k(0)}
   <button class="key" data-act="key" data-k="del" aria-label="Delete">${ic('delete')}</button></div>
  <p class="sec">${ic('lock','s')} ${S.user.pin==='1234'?'Demo UPI PIN is 1234':'Enter your 4-digit UPI PIN'}</p>`;
}
function askPin(title,sub,err){
  return new Promise(res=>{
    if(pinState){const r=pinState.res;pinState=null;r(null);}
    openSheet(pinHTML(title,sub,err));
    pinState={val:'',res};
  });
}
function pinKey(k){
  if(!pinState)return;
  let v=pinState.val;
  if(k==='del')v=v.slice(0,-1);else if(v.length<4)v+=k;
  pinState.val=v;
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<v.length));
  if(v.length===4){const r=pinState.res;pinState=null;setTimeout(()=>r(v),140);}
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!overlay.hidden&&!sheetLocked)closeSheet();
  if(pinState){
    if(/^\d$/.test(e.key))pinKey(e.key);
    else if(e.key==='Backspace')pinKey('del');
  }
  if(e.key==='Enter'&&e.target.id==='amt'){const b=$('#payBtn');if(b&&!b.disabled)b.click();}
});
async function verifyPin(title,sub){
  let att=0,err='';
  for(;;){
    const pin=await askPin(title,sub,err);
    if(pin===null)return false;
    if(pin===S.user.pin)return true;
    att++;
    if(att>=3){closeSheet();toast('Too many wrong PIN attempts. Try again.');return false;}
    const left=3-att;err=`Incorrect PIN. ${left} attempt${left===1?'':'s'} left.`;
  }
}

/* ---------- pseudo QR ---------- */
function qrSvg(seedStr){
  const n=25;let s=hash(seedStr)||1;
  const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};
  const inFinder=(x,y)=>(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);
  let r='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if(inFinder(x,y))continue;
    if(rnd()>0.52)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  const finder=(ox,oy)=>`<path fill-rule="evenodd" d="M${ox} ${oy}h7v7h-7z M${ox+1} ${oy+1}v5h5v-5z"/><rect x="${ox+2}" y="${oy+2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 ${n} ${n}" fill="currentColor" shape-rendering="crispEdges" role="img" aria-label="Sample QR pattern">${r}${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}

  go('pay');
}
screens.pay=()=>{

  return `${hdr(d.locked?'Confirm payment':'Send money')}<div class="pad">
   <div class="payee">${lead}<div class="rt"><b>${esc(p.name)}</b><small>${esc(p.sub)}</small></div></div>

   <div class="err c" id="amtErr" role="alert"></div>
   ${d.locked?'':`<div class="chips" style="justify-content:center">${[100,500,1000,2000].map(v=>`<button class="chip" data-act="chip" data-v="${v}">${rs(v)}</button>`).join('')}</div>
   <input class="input" id="note" placeholder="Add a note (optional)" maxlength="50" value="${esc(d.note)}" aria-label="Note">`}
   <button class="from" data-act="pickbank">${ic('landmark')}<span><small>Pay from</small><b>${esc(bankLabel(d.bankId))}</b></span>${ic('chevron-down')}</button>

after.pay=()=>{
  updatePay();

};
function updatePay(){
  const b=$('#payBtn');if(!b)return;
  const v=parseFloat(payDraft.amount);
  const ok=v>0&&v<=100000;
  b.disabled=!ok;b.textContent=ok?`Pay ${rs(v)}`:'Pay';
}
function sanitizeAmount(v){
  v=v.replace(/[^\d.]/g,'');
  const parts=v.split('.');
  let a=parts[0].replace(/^0+(?=\d)/,'').slice(0,7);
  if(parts.length>1)return a+'.'+parts.slice(1).join('').slice(0,2);
  return a;
}
async function doPay(){
  const d=payDraft,amt=parseFloat(d.amount),errEl=$('#amtErr');
  if(!(amt>0)){errEl.textContent='Enter an amount.';return;}
  if(amt>100000){errEl.textContent='UPI limit is \u20B91,00,000 per payment.';return;}
  const bank=bankById(d.bankId);
  if(amt>bank.balance){errEl.textContent=`Not enough balance in ${bank.short} \u2022\u2022${bank.last4}. Choose another account or add demo funds from Profile.`;return;}
  errEl.textContent='';
  const ok=await verifyPin('Enter UPI PIN',`Paying ${rs(amt)} to ${d.payee.name} from ${bank.short} \u2022\u2022${bank.last4}`);
  if(!ok)return;
  sheetLocked=true;
  openSheet('<div class="proc"><span class="spin"></span><p>Processing payment\u2026</p></div>');
  await sleep(1000);
  sheetLocked=false;closeSheet();
  const t=executePay(d,amt);
  stack.pop();go('result',{id:t.id});
}
function executePay(d,amt){
  const bank=bankById(d.bankId);
  const t={id:newId(),ref:ref12(),ts:Date.now(),dir:'out',kind:d.payee.kind,title:d.payee.name,sub:d.payee.sub,icon:d.payee.icon||null,amount:amt,bankId:bank.id,note:d.note||'',status:'success',payee:d.payee};
  if(bank.balance<amt){t.status='failed';t.reason='Insufficient balance in '+bankLabel(bank.id);}
  else{
    bank.balance=round2(bank.balance-amt);
    if(amt>=20){
      const prize=PRIZES[hash(t.id)%PRIZES.length];
      S.rewards.push({id:'r'+t.id,txnId:t.id,amount:prize,scratched:false,ts:t.ts});
      t.reward=true;
    }
  }
  S.txns.unshift(t);save();return t;
}

function alertText(t){
  if(t.status==='failed')return `Payment of ${rs(t.amount)} to ${t.title} failed`;
  if(t.status==='pending')return `Waiting for ${t.title} to pay ${rs(t.amount)}`;
  if(t.kind==='recv')return `${t.title} paid you ${rs(t.amount)}`;
  if(t.kind==='add')return `${rs(t.amount)} added to your account`;
  if(t.kind==='reward')return `You won ${rs(t.amount)} from a scratch card`;
  if(t.kind==='bill')return `${t.title} payment of ${rs(t.amount)} done`;
  if(t.kind==='self')return `${rs(t.amount)} moved between your accounts`;
  return `You paid ${rs(t.amount)} to ${t.title}`;
}
screens.alerts=()=>{
  const unscr=S.rewards.filter(r=>!r.scratched).length;
  const items=[];
  if(unscr)items.push(`<button class="row" data-act="go" data-s="rewards"><span class="ico">${ic('gift')}</span><span class="rt"><b style="white-space:normal">You have ${unscr} scratch card${unscr>1?'s':''} to reveal</b><small>Open Rewards</small></span>${ic('chevron-right')}</button>`);
  if(S.user.pin==='1234')items.push(`<button class="row" data-act="changepin"><span class="ico">${ic('lock')}</span><span class="rt"><b style="white-space:normal">Change the demo UPI PIN</b><small>Choose your own 4-digit PIN</small></span>${ic('chevron-right')}</button>`);
  S.txns.slice(0,12).forEach(t=>items.push(`<button class="row" data-act="txn" data-id="${t.id}"><span class="ico ${t.dir==='in'&&t.status==='success'?'in':''} ${t.status==='failed'?'bad':''}">${ic(txIcon(t))}</span><span class="rt"><b style="white-space:normal">${esc(alertText(t))}</b><small>${fmtShort(t.ts)}</small></span></button>`));
  return `${hdr('Alerts',{back:false})}<div class="pad">${items.length?`<div class="card">${items.join('')}</div>`:`<div class="empty">${ic('bell','l')}<p>No alerts yet.</p></div>`}</div>`;
};

/* ---------- actions ---------- */
acts.go=d=>go(d.s);
acts.back=()=>back();
acts.tab=d=>root(d.s);
acts.home=()=>root('home');
acts.copy=d=>copy(d.t);
acts.close=()=>closeSheet();
acts.key=d=>pinKey(d.k);
acts.share=d=>shareReceipt(d.id);
acts.txn=d=>go('txn',{id:d.id});
acts.bill=d=>openBill(d.cat);
acts.chip=d=>{const a=$('#amt');a.value=d.v;payDraft.amount=String(d.v);$('#amtErr').textContent='';updatePay();};
acts.pay=()=>doPay();
acts.hf=d=>{hf=d.f;drawHist();};
acts.payc=d=>{const c=S.contacts.find(x=>x.id===d.id);startPay({name:c.name,sub:fmtPhone(c.phone),kind:'mobile',phone:c.phone,upi:c.upi});};
acts.paynum=d=>startPay({name:fmtPhone(d.n),sub:'Mobile number',kind:'mobile',phone:d.n,upi:d.n+'@paylite'});
acts.payupi=d=>startPay({name:d.n,sub:d.u,kind:'upi',upi:d.u});
acts.verifyUpi=()=>{
  const v=$('#upi').value.trim(),e=$('#upiErr');
  if(!UPI_RE.test(v)){e.textContent='Enter a valid UPI ID, for example name@bank.';return;}
  const known=S.contacts.find(c=>c.upi.toLowerCase()===v.toLowerCase());
  const name=known?known.name:titleCase(v.split('@')[0].replace(/[._-]+/g,' ').replace(/\d+/g,'').trim())||v;
  startPay({name,sub:v,kind:'upi',upi:v});
};
acts.verifyBank=()=>{
  const n=$('#bn').value.trim(),a=$('#ba').value.replace(/\s/g,''),i=$('#bi').value.trim().toUpperCase(),e=$('#bankErr');
  if(n.length<2){e.textContent='Enter the account holder name.';return;}
  if(!/^\d{9,18}$/.test(a)){e.textContent='Account number must be 9 to 18 digits.';return;}
  if(!IFSC_RE.test(i)){e.textContent='Enter a valid 11-character IFSC code, for example SBIN0001234.';return;}
  const bn=IFSC_BANKS[i.slice(0,4)]||'Bank';
  startPay({name:titleCase(n),sub:`${bn}, A/c ending ${a.slice(-4)}, ${i}`,kind:'bank'});
};
acts.merch=d=>{const m=MERCH[d.i];stack.pop();startPay({name:m.name,sub:m.upi,kind:'merchant',upi:m.upi});};
acts.scanupi=()=>{stack.pop();go('toUpi');};
acts.again=d=>{const t=txnById(d.id);startPay(t.payee,{amount:String(t.amount),locked:t.kind==='bill'});};
acts.pickbank=()=>{
  openSheet(`<div class="sheet-l">Pay from</div>${S.banks.map(b=>`<button class="pick ${b.id===payDraft.bankId?'on':''}" data-act="setbank" data-id="${b.id}"><span class="ico">${ic('landmark')}</span><span><b>${esc(b.name)}</b><small>Account ending ${esc(b.last4)}</small></span>${b.id===payDraft.bankId?ic('check'):''}</button>`).join('')}`);
};
acts.setbank=d=>{payDraft.bankId=d.id;closeSheet();render();};
acts.plan=d=>{syncBill();bf.amount=d.a;$('#billArea').innerHTML=billArea();updBillCta();};
acts.fetch=()=>{
  syncBill();
  const err=billIdError(),e=$('#billErr');
  if(err){e.textContent=err;return;}
  e.textContent='';
  const h=hash(bf.provider+bf.id);
  const amount=300+(h%2400);
  const due=fmtDay(Date.now()+(3+h%9)*864e5);
  bf.bill={amount,name:BILL_NAMES[h%BILL_NAMES.length],due};
  bf.amount=String(amount);
  $('#billArea').innerHTML=billArea();updBillCta();
  toast('Bill fetched (sample amount)');
};
acts.billpay=()=>{
  syncBill();
  const c=CATS[bf.cat],err=billIdError(),e=$('#billErr');
  if(err){e.textContent=err;return;}
  const amt=parseFloat(bf.amount);
  if(!(amt>0)){e.textContent='Enter an amount.';return;}
  const sub=c.phone?`Mobile ${bf.id}`:c.len4?`Card ending ${bf.id}`:`${c.label.split(' (')[0]}: ${bf.id}`;
  startPay({name:bf.provider,sub,kind:'bill',icon:c.icon,cat:bf.cat},{amount:String(amt),locked:true});
};
acts.balance=()=>{
  if(S.banks.length===1)return checkBalance(S.banks[0].id);
  openSheet(`<div class="sheet-l">Check balance of</div>${S.banks.map(b=>`<button class="pick" data-act="balbank" data-id="${b.id}"><span class="ico">${ic('landmark')}</span><span><b>${esc(b.name)}</b><small>Account ending ${esc(b.last4)}</small></span>${ic('chevron-right')}</button>`).join('')}`);
};
acts.balbank=d=>checkBalance(d.id);
async function checkBalance(id){
  const b=bankById(id);
  const ok=await verifyPin('Enter UPI PIN',`To view the balance of ${b.short} \u2022\u2022${b.last4}`);
  if(!ok)return;
  openSheet(`<div class="balres"><small class="muted">${esc(b.name)} \u2022\u2022${esc(b.last4)}</small><div class="bigbal">${rs(b.balance)}</div><small class="muted">Available balance</small></div><button class="btn" data-act="close">Done</button>`);
}
acts.setdef=d=>{S.defaultBank=d.id;save();render();toast('Default account updated');};
acts.theme=d=>{S.theme=d.t;save();applyTheme();render();};
acts.editname=()=>{
  openSheet(`<div class="sheet-l">Edit your name</div><input class="input" id="nn" maxlength="30" value="${esc(S.user.name)}" aria-label="Your name"><div class="err" id="nnErr"></div><button class="btn" data-act="savename">Save name</button>`);
};
acts.savename=()=>{
  const v=$('#nn').value.trim().replace(/\s+/g,' ');
  if(v.length<2){$('#nnErr').textContent='Enter at least 2 characters.';return;}
  S.user.name=v;save();closeSheet();render();toast('Name updated');
};
acts.linkbank=()=>{
  openSheet(`<div class="sheet-l">Link a bank account</div>
   <label class="lab" for="lbn">Bank</label><select class="input" id="lbn">${BANK_NAMES.map(n=>`<option>${n}</option>`).join('')}</select>
   <label class="lab" for="lb4">Last 4 digits of account number</label><input class="input" id="lb4" inputmode="numeric" maxlength="4" autocomplete="off">
   <div class="err" id="lbErr"></div><button class="btn" data-act="savebank">Link account</button>`);
};
acts.savebank=()=>{
  const n=$('#lbn').value,d=$('#lb4').value.replace(/\D/g,'');
  if(d.length!==4){$('#lbErr').textContent='Enter exactly 4 digits.';return;}
  if(S.banks.some(b=>b.name===n&&b.last4===d)){$('#lbErr').textContent='This account is already linked.';return;}
  S.banks.push({id:'b'+Date.now(),name:n,short:bankShort(n),last4:d,balance:10000});
  save();closeSheet();render();toast('Account linked with \u20B910,000 demo balance');
};
acts.addfunds=()=>{
  openSheet(`<div class="sheet-l">Add demo funds</div>
   <label class="lab" for="afb">To account</label><select class="input" id="afb">${S.banks.map(b=>`<option value="${b.id}">${esc(b.name)} \u2022\u2022${esc(b.last4)}</option>`).join('')}</select>
   <label class="lab" for="afa">Amount</label><input class="input" id="afa" inputmode="decimal" placeholder="\u20B9 0" autocomplete="off">
   <div class="chips">${[500,1000,5000,10000].map(v=>`<button class="chip" data-act="afchip" data-v="${v}">${rs(v)}</button>`).join('')}</div>
   <div class="err" id="afErr"></div><button class="btn" data-act="saveadd">Add funds</button>`);
};
acts.afchip=d=>{$('#afa').value=d.v;};
acts.saveadd=()=>{
  const v=parseFloat(sanitizeAmount($('#afa').value)),b=bankById($('#afb').value);
  if(!(v>0)||v>100000){$('#afErr').textContent='Enter an amount up to \u20B91,00,000.';return;}
  b.balance=round2(b.balance+v);
  S.txns.unshift({id:newId(),ref:ref12(),ts:Date.now(),dir:'in',kind:'add',title:'Demo funds added',sub:b.name,amount:v,bankId:b.id,note:'',status:'success'});
  save();closeSheet();render();toast(`${rs(v)} added to ${b.short} \u2022\u2022${b.last4}`);
};
acts.reqsheet=()=>{
  openSheet(`<div class="sheet-l">Request money</div>
   <label class="lab" for="rqc">From</label><select class="input" id="rqc">${S.contacts.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
   <label class="lab" for="rqa">Amount</label><input class="input" id="rqa" inputmode="decimal" placeholder="\u20B9 0" autocomplete="off">
   <p class="muted" style="font-size:13px;margin-top:10px">In this demo, your contact accepts after a few seconds.</p>
   <div class="err" id="rqErr"></div><button class="btn" data-act="sendreq">Send request</button>`);
};
acts.sendreq=()=>{
  const c=S.contacts.find(x=>x.id===$('#rqc').value),v=parseFloat(sanitizeAmount($('#rqa').value));
  if(!(v>0)||v>100000){$('#rqErr').textContent='Enter an amount up to \u20B91,00,000.';return;}
  const t={id:newId(),ref:ref12(),ts:Date.now(),dir:'in',kind:'recv',title:c.name,sub:fmtPhone(c.phone),amount:v,bankId:S.defaultBank,note:'Money request',status:'pending'};
  S.txns.unshift(t);save();closeSheet();
  toast(`Request sent to ${c.name.split(' ')[0]}`);
  if(['history','home'].includes(cur().s))render();
  scheduleRequest(t.id,2800);
};
function scheduleRequest(id,ms){
  setTimeout(()=>{
    const t=txnById(id);if(!t||t.status!=='pending')return;
    t.status='success';t.ts=Date.now();
    const b=bankById(t.bankId);b.balance=round2(b.balance+t.amount);
    save();toast(`${t.title.split(' ')[0]} paid you ${rs(t.amount)}`);
    if(['history','home'].includes(cur().s))render();
  },ms);
}
acts.scratch=d=>{
  const r=S.rewards.find(x=>x.id===d.id);if(!r||r.scratched)return;
  r.scratched=true;freshReward=r.id;
  if(r.amount>0){
    const b=bankById(S.defaultBank);b.balance=round2(b.balance+r.amount);
    S.txns.unshift({id:newId(),ref:ref12(),ts:Date.now(),dir:'in',kind:'reward',title:'Scratch card reward',sub:'PayLite Rewards',amount:r.amount,bankId:b.id,note:'',status:'success'});
  }
  save();render();
  toast(r.amount>0?`You won ${rs(r.amount)}!`:'Better luck next time');
};
acts.changepin=async()=>{
  const ok=await verifyPin('Enter current PIN','Step 1 of 3');
  if(!ok)return;
  const n1=await askPin('Set a new PIN','Step 2 of 3: choose 4 digits');
  if(n1===null)return;
  let err='';
  for(;;){
    const n2=await askPin('Confirm new PIN','Step 3 of 3',err);
    if(n2===null)return;
    if(n2===n1){S.user.pin=n1;save();closeSheet();toast('UPI PIN changed');return;}
    err='PINs do not match. Try again.';
  }
};
acts.reset=()=>{
  openSheet(`<div class="sheet-l">Reset demo data?</div><p class="muted">This clears your history, rewards and linked accounts, and restores the sample data.</p>
   <div class="two"><button class="btn ghost" data-act="close">Cancel</button><button class="btn warn" data-act="doreset">Reset</button></div>`);
};
acts.doreset=()=>{S=seed();save();applyTheme();closeSheet();root('home');toast('Demo data reset');};

acts.help=()=>{
  openSheet(`<div class="sheet-l">Help</div>
   <p class="muted">PayLite is a practice app. No real money moves and no real bank is connected.</p>
   <p style="margin-top:10px">Demo UPI PIN: <b>1234</b>. You can change it from Alerts or Profile.</p>
   <p style="margin-top:10px">Need money to test with? Open Profile, then Add demo funds.</p>
   <p style="margin-top:10px">Scan &amp; pay uses sample merchant codes because the camera is off.</p>
   <button class="btn" data-act="close">Got it</button>`);
};
acts.invite=()=>{
  const code=S.user.name.split(' ')[0].toUpperCase().replace(/[^A-Z]/g,'')+(100+hash(S.user.upi)%900);
  const text=`Join me on PayLite, a UPI practice app. Use my invite code ${code}.`;
  openSheet(`<div class="sheet-l">Invite friends</div><p class="muted">Share your invite code with friends.</p>
   <div class="billcard" style="text-align:center"><div class="n">${esc(code)}</div></div>
   <button class="btn" data-act="copy" data-t="${esc(text)}">Copy invite message</button>`);
};
acts.selfsheet=()=>{
  const opts=n=>S.banks.map((b,i)=>`<option value="${b.id}" ${i===n?'selected':''}>${esc(b.name)} \u2022\u2022${esc(b.last4)}</option>`).join('');
  openSheet(`<div class="sheet-l">Self transfer</div>
   <label class="lab" for="sf">From</label><select class="input" id="sf">${opts(0)}</select>
   <label class="lab" for="st">To</label><select class="input" id="st">${opts(1)}</select>
   <label class="lab" for="sa">Amount</label><input class="input" id="sa" inputmode="decimal" placeholder="\u20B9 0" autocomplete="off">
   <div class="err" id="sErr" role="alert"></div><button class="btn" data-act="selfgo">Continue</button>`);
};
acts.selfgo=async()=>{
  const f=bankById($('#sf').value),t=bankById($('#st').value),v=parseFloat(sanitizeAmount($('#sa').value)),e=$('#sErr');
  if(f.id===t.id){e.textContent='Choose two different accounts.';return;}
  if(!(v>0)||v>100000){e.textContent='Enter an amount up to \u20B91,00,000.';return;}
  if(v>f.balance){e.textContent=`Not enough balance in ${f.short} \u2022\u2022${f.last4}.`;return;}
  const ok=await verifyPin('Enter UPI PIN',`Move ${rs(v)} from ${f.short} \u2022\u2022${f.last4} to ${t.short} \u2022\u2022${t.last4}`);
  if(!ok)return;
  sheetLocked=true;
  openSheet('<div class="proc"><span class="spin"></span><p>Processing transfer\u2026</p></div>');
  await sleep(900);
  sheetLocked=false;closeSheet();
  f.balance=round2(f.balance-v);t.balance=round2(t.balance+v);
  const tx={id:newId(),ref:ref12(),ts:Date.now(),dir:'out',kind:'self',title:`Self transfer to ${t.short} \u2022\u2022${t.last4}`,sub:`From ${f.short} \u2022\u2022${f.last4}`,amount:v,bankId:f.id,note:'',status:'success'};
  S.txns.unshift(tx);save();go('result',{id:tx.id});
};


/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=acts[el.dataset.act];
  if(fn){e.preventDefault();fn(el.dataset,el);}
});
document.addEventListener('input',e=>{
  const id=e.target.id,s=cur().s;
  if(id==='amt'&&payDraft){e.target.value=sanitizeAmount(e.target.value);payDraft.amount=e.target.value;$('#amtErr').textContent='';updatePay();}
  else if(id==='note'&&payDraft)payDraft.note=e.target.value;
  else if(id==='q')drawContacts();
  else if(id==='sq')drawSearch();
  else if(id==='hq'){hq=e.target.value;drawHist();}
  else if(s==='bill'&&['prov','bid','bamt'].includes(id)){
    const changed=syncBill();
    if(bf.bill&&(id==='prov'||changed)){bf.bill=null;bf.amount='';$('#billArea').innerHTML=billArea();updBillCta();}
    else updBillCta();
    const be=$('#billErr');if(be)be.textContent='';
  }
  else if(id==='upi'){const u=$('#upiErr');if(u)u.textContent='';}
  else if(['bn','ba','bi'].includes(id)){const b=$('#bankErr');if(b)b.textContent='';}
});

/* ---------- boot ---------- */
applyTheme();
S.txns.filter(t=>t.status==='pending').forEach(t=>scheduleRequest(t.id,1200));
render();
})();
</script>
